name: trimtime
services:
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trimtime}
      MYSQL_USER: ${MYSQL_USER:-trimtime}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-trimtime}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED
      DB_USER: ${MYSQL_USER:-trimtime}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - photos:/app/storage/photos
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - backend
volumes:
  mysql-data:
  photos:
